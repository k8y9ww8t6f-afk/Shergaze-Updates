name: Update shared Blue Magic list
on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blue-magic-data
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/Mirror-BlueMagic.py
      - name: Publish changed monster facts
        run: |
          if git diff --quiet -- blue-magic.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blue-magic.json
          git commit -m 'Sync confirmed Blue Magic discoveries'
          git push
